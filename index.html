<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18211d">
    <meta name="description" content="A quiet, considered space for a game of chess.">
    <title>Chess — Ready to play</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">A little strategy goes a long way</p>
        </header>

        <section class="game" aria-label="Chess game">
            <div class="board-shell">
                <div class="board-layout">
                    <div class="file-labels file-labels-top" aria-hidden="true">
                        <span>a</span>
                        <span>b</span>
                        <span>c</span>
                        <span>d</span>
                        <span>e</span>
                        <span>f</span>
                        <span>g</span>
                        <span>h</span>
                    </div>
                    <div class="rank-labels" aria-hidden="true">
                        <span>8</span>
                        <span>7</span>
                        <span>6</span>
                        <span>5</span>
                        <span>4</span>
                        <span>3</span>
                        <span>2</span>
                        <span>1</span>
                    </div>
                    <div class="board" id="board">
                        <!-- Add the chess squares here with JavaScript. -->
                    </div>
                    <div class="rank-labels rank-labels-right" aria-hidden="true">
                        <span>8</span>
                        <span>7</span>
                        <span>6</span>
                        <span>5</span>
                        <span>4</span>
                        <span>3</span>
                        <span>2</span>
                        <span>1</span>
                    </div>
                    <div class="file-labels" aria-hidden="true">
                        <span>a</span>
                        <span>b</span>
                        <span>c</span>
                        <span>d</span>
                        <span>e</span>
                        <span>f</span>
                        <span>g</span>
                        <span>h</span>
                    </div>
                </div>
            </div>

            <aside class="board-notes">
                <span class="status-dot" aria-hidden="true"></span>
                <p class="status-text">White to move</p>
            </aside>
        </section>
        <footer>Chess <span aria-hidden="true">·</span> Ready to play</footer>
    </main>
</body>
</html>
