<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171a1b">
    <title>Chessboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">A little strategy goes a long way</p>
            <h1>Chessboard</h1>
            <p class="intro">The board is ready for you to build with JavaScript.</p>
        </header>

        <section class="game" aria-label="Chess game">
            <div class="board-shell">
                <div class="board" id="board">
                    <!-- Add the chess squares here with JavaScript. -->
                </div>
            </div>

            <aside class="board-notes">
                <span class="status-dot" aria-hidden="true"></span>
                <div>
                    <h2>Ready when you are</h2>
                    <p>Add the squares and gameplay interactions in your JavaScript file.</p>
                </div>
            </aside>
        </section>
        <footer>Chessboard <span aria-hidden="true">·</span> Ready to play</footer>
    </main>
</body>
</html>
