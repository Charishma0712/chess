<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#18211d">
    <meta name="description" content="A quiet, considered space for a game of chess.">
    <title>Chess — Ready to play</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">A little strategy goes a long way</p>
        </header>

        <section class="game" aria-label="Chess game">
            <div class="board-shell">
                <div class="board" id="board">
                    <!-- Add the chess squares here with JavaScript. -->
                </div>
            </div>

            <aside class="board-notes">
                <span class="status-dot" aria-hidden="true"></span>
                <p class="status-text">White to move</p>
            </aside>
        </section>
        <footer>Chess <span aria-hidden="true">·</span> Ready to play</footer>
    </main>
</body>
</html>
